<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyGO</title>
    <style>:root{color-scheme:light}body{background-color:#fff;--dsh-boot-bg:#fff}@media(prefers-color-scheme:dark){:root{color-scheme:dark}body{background-color:#151517;--dsh-boot-bg:#151517}}</style>
    <script>document.documentElement.dataset.dsThemeSource='system';document.addEventListener('DOMContentLoaded',()=>document.body.toggleAttribute('data-ds-dark-theme',matchMedia('(prefers-color-scheme: dark)').matches),{once:true})</script>
    <!-- DSH_ASSETS -->
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
